<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a restaurant · CafeConnect</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f2efe8;color:#1e1b16;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100svh;display:grid;place-items:center;padding:28px}
    section{width:min(560px,100%)} .mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#1e1b16;color:white;font-size:24px;box-shadow:0 8px 24px rgba(30,27,22,.15)}
    h1{margin:22px 0 8px;font-size:clamp(34px,8vw,54px);line-height:.98;letter-spacing:-.045em;text-wrap:balance}
    p{margin:0 0 28px;color:#746e63;font-size:17px;line-height:1.5;text-wrap:pretty}
    .list{display:grid;gap:12px}.venue{min-height:76px;display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:inherit;background:#fffdfa;border-radius:20px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 8px rgba(30,27,22,.06);transition:transform 150ms ease-out,box-shadow 150ms ease-out}
    .venue:hover{box-shadow:0 0 0 1px rgba(0,0,0,.09),0 8px 22px rgba(30,27,22,.09)}.venue:active{transform:scale(.96)}
    .initial{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#eee8dc;font-weight:800;font-size:19px}.name{font-size:18px;font-weight:750;flex:1}.arrow{font-size:24px;color:#9c9588}
    .empty{padding:20px;background:#fffdfa;border-radius:20px;color:#746e63}
  </style>
</head>
<body><main><section>
  <div class="mark" aria-hidden="true">☕</div>
  <h1>Where are you?</h1>
  <p>Choose the restaurant you are visiting. Your table link will open inside that restaurant.</p>
  <div class="list">
    {% for restaurant in restaurants %}
      <a class="venue" href="/r/{{ restaurant.slug }}/{% if suffix %}{{ suffix }}{% endif %}">
        <span class="initial">{{ restaurant.name|slice:":1"|upper }}</span>
        <span class="name">{{ restaurant.name }}</span><span class="arrow">›</span>
      </a>
    {% empty %}<div class="empty">No restaurants are currently available.</div>{% endfor %}
  </div>
</section></main></body></html>
