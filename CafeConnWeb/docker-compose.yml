# CafeConnect — Sissi Bistro Bar
#
# Run ALL docker compose commands from THIS directory (CafeConnWeb/):
#
#   cd MonoRepForCafeConn/CafeConnWeb
#   cp ../.env.example ../.env        # once; then edit DJANGO_LAN_HOST
#   docker compose up -d
#   docker compose exec web python manage.py seed_bar
#
# See RUNBOOK.md for the full update-and-launch procedure.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafeconnect}
      POSTGRES_USER: ${POSTGRES_USER:-cafeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeconnect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafeconnect} -d ${POSTGRES_DB:-cafeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 backend_core.asgi:application"
    env_file:
      - path: ../.env
        required: false
    environment:
      # App config — override via ../.env for production values
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-cafeconnect-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Rome}
      # Wildcard hosts: fine for a trusted LAN; tighten for public deployments
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DJANGO_CORS_ALLOW_CREDENTIALS: ${DJANGO_CORS_ALLOW_CREDENTIALS:-false}
      # DB — defaults to the local Compose database, but can point to Neon via ../.env.
      POSTGRES_DB: ${POSTGRES_DB:-cafeconnect}
      POSTGRES_USER: ${POSTGRES_USER:-cafeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeconnect}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      # Mount source so Python file edits are visible without a rebuild.
      # After any .py change: docker compose restart web
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
